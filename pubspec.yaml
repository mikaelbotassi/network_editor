name: network_editor
description: "Flutter package for editing network maps with nodes and segments."
version: 0.0.1
homepage:

environment:
  sdk: ^3.11.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_map_location_marker: ^10.2.0
  tabler_icons_plus: ^3.44.0
  result_dart: ^2.2.0
  flutter_svg: ^2.3.0
  geolocator: ^14.0.2
  simple_painter: ^1.4.0
  path_provider: ^2.1.5
  electric_shapes: ^1.0.11
  electric_digital_sketch:
    path: ../electric_digital_sketch

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
